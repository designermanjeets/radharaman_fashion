<app-breadcrumb [breadcrumb]="breadcrumb"></app-breadcrumb>

<!-- Category SEO Content Section -->
<section *ngIf="categoryTitle" class="section-b-space pt-0 pb-3">
    <div class="container-fluid-lg">
        <div class="row">
            <div class="col-12 text-center">
                <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0px;" class="mb-3 mt-5 text-dark">{{
                    categoryTitle }}</h1>
                <p style="font-size: 1rem; color: #555; max-width: 800px; margin: 0 auto; line-height: 1.5;">{{
                    categoryDescription }}</p>
            </div>
        </div>
    </div>
</section>

<app-collection-category-slider [filter]="filter"
    *ngIf="layout == 'collection_category_slider'"></app-collection-category-slider>
<app-collection-category-sidebar [filter]="filter"
    *ngIf="layout == 'collection_category_sidebar'"></app-collection-category-sidebar>
<app-collection-banner [filter]="filter" *ngIf="layout == 'collection_banner'"></app-collection-banner>
<app-collection-left-sidebar [filter]="filter"
    *ngIf="layout == 'collection_left_sidebar'"></app-collection-left-sidebar>
<app-collection-right-sidebar [filter]="filter"
    *ngIf="layout == 'collection_right_sidebar'"></app-collection-right-sidebar>
<app-collection-list [filter]="filter"
    *ngIf="layout == 'collection_3_grid' || layout == 'collection_4_grid' || layout == 'collection_5_grid' || layout == 'collection_list_view'"></app-collection-list>
<app-collection-offcanvas-filter [filter]="filter"
    *ngIf="layout == 'collection_offcanvas_filter'"></app-collection-offcanvas-filter>
<app-collection-no-sidebar [filter]="filter" *ngIf="layout == 'collection_no_sidebar'"></app-collection-no-sidebar>
